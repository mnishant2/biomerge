# Config for LoRA-EL experiment
_target_: src.models.lora_el.build_lora_el_model

params:
  base_model: ${base_model}
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  load_in_8bit: ${load_in_8bit}
  
training:
  output_dir: ${output_root}/${task}/lora_${task}
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 16
  num_train_epochs: 3
  learning_rate: 2e-4
  fp16: true
  report_to: ["wandb"]
  logging_steps: 50
  evaluation_strategy: steps
  eval_steps: 500
  save_strategy: steps
  save_steps: 500
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false 