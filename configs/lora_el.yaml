# Config for training LoRA adapter for Entity Linking task
mode: train # Explicitly set the mode for this config

datamodule:
  _target_: src.datamodules.el_module.ELDataModule
  params:
    tokenizer_name: ${base_model}
    path: ${data_root}/EL
    max_length: 256  # Match sliding window size used in dataset creation
    apply_sampling: true
    splits: ["train", "dev"]
    load_immediately: true

model:
  _target_: src.models.lora_el.build_lora_el_model
  params:
    base_model: ${base_model}
    load_in_8bit: true
    lora_rank: 16 # Example
    lora_alpha: 32 # Example
    lora_dropout: 0.05 # Example
    target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"] # Example

training:
  output_dir: ${output_root}/el/lora_el
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 32
  num_train_epochs: 3
  fp16: true
  gradient_checkpointing: true
  report_to: ["wandb"]
  logging_steps: 50
  eval_strategy: steps
  eval_steps: 500
  save_strategy: steps
  save_steps: 500
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  remove_unused_columns: false
  
wandb_project: biomedical-entity-model-merging
wandb_name: lora_el_training

task: el # Define task for callbacks
run_test_eval: true # Evaluate on test set after training

# Whether to merge and save adapter weights with base model after training
save_merged: false 

defaults:
  - _self_
  - defaults 