# Config for training SAPBERT model
datamodule:
  _target_: src.datamodules.sapbert_module.SapBERTDataModule
  split: train
  tokenizer_name: microsoft/BiomedNLP-PubMedBERT-base-uncased-abstract-fulltext
  path: data/union/SAPBERT

model:
  _target_: sentence_transformers.SentenceTransformer
  model_name_or_path: microsoft/BiomedNLP-PubMedBERT-base-uncased-abstract-fulltext

training:
  output_dir: outputs/sapbert
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 2
  num_train_epochs: 5
  fp16: true
  report_to: ["wandb"]
  logging_steps: 50
  evaluation_strategy: steps
  eval_steps: 500
  save_strategy: steps
  save_steps: 500
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  learning_rate: 2e-5
  
wandb_project: biomedical-entity-model-merging
wandb_name: sapbert_training 