# Config for full fine-tuning of Llama model
datamodule:
  _target_: src.datamodules.el_module.ELDataModule
  split: train
  tokenizer_name: meta-llama/Llama-3-8B
  path: data/union/fullft

model:
  _target_: src.models.full_llama.FullLlamaModel
  base_model: meta-llama/Llama-3-8B

training:
  output_dir: outputs/full_llama
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 64
  gradient_checkpointing: true
  num_train_epochs: 3
  fp16: true
  report_to: ["wandb"]
  logging_steps: 50
  evaluation_strategy: steps
  eval_steps: 250
  save_strategy: steps
  save_steps: 250
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  learning_rate: 2e-5
  
wandb_project: biomedical-entity-model-merging
wandb_name: full_llama_training 