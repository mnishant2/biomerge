# Config for training LoRA adapter for NER task
mode: train # Explicitly set the mode for this config

datamodule:
  _target_: src.datamodules.ner_module.NERDataModule
  params:
    tokenizer_name: ${base_model}
    path: ${data_root}/NER
    max_length: 256  # Match sliding window size used in dataset creation
    splits: ["train", "dev"] # Specify splits to load
    load_immediately: true

model:
  _target_: src.models.lora_ner.build_lora_ner_model
  params:
    base_model: ${base_model}
    load_in_8bit: true
    lora_rank: 8 # Example
    lora_alpha: 16 # Example
    lora_dropout: 0.05 # Example
    num_labels: 3

training:
  output_dir: ${output_root}/ner/lora_ner
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  num_train_epochs: 3
  fp16: true
  gradient_checkpointing: false # Explicitly disable gradient checkpointing
  report_to: ["wandb"]
  logging_steps: 50
  eval_strategy: steps
  eval_steps: 50
  save_strategy: steps
  save_steps: 500
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  remove_unused_columns: false
  
wandb_project: biomedical-entity-model-merging
wandb_name: lora_ner_training

task: ner # Define task for callbacks
run_test_eval: true # Evaluate on test set after training

# Whether to merge and save adapter weights with base model after training
save_merged: false 

defaults:
  - _self_
  - defaults 